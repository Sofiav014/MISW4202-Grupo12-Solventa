services:
  gateway:
    build: .
    command: ["python", "-m", "gateway.servidor"]
    env_file: [.env.example]
    ports: ["${GATEWAY_PORT:-8080}:8000"]
    depends_on:
      detector: {condition: service_healthy}
      identity: {condition: service_healthy}
      journey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 2s
      retries: 10
  detector:
    build: .
    command: ["python", "-m", "dobles_http.servidor"]
    environment: {SERVICIO_STUB: detector}
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
  identity:
    build: .
    command: ["python", "-m", "dobles_http.servidor"]
    environment: {SERVICIO_STUB: identidad}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
  journey:
    build: .
    command: ["python", "-m", "dobles_http.servidor"]
    environment: {SERVICIO_STUB: journey}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
