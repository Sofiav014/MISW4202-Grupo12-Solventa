[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solventa-gateway"
version = "0.1.0"
dependencies = ["Flask>=3.0,<4", "PyJWT>=2.8,<3", "requests>=2.31,<3", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
# Separados a propósito: quien solo consolida resultados no necesita locust
# (que arrastra gevent), y quien solo genera carga no necesita matplotlib.
carga = ["locust>=2.20,<3"]
analisis = ["pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
python_files = ["probar_*.py"]

[tool.setuptools.packages.find]
include = ["gateway*", "dobles_http*", "identidad*", "deteccion*", "parametros*", "generador*", "analisis*"]
